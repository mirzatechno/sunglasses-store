<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sunglasses Store</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f5f5;
            color: #222;
        }

        header {
            background: black;
            color: white;
            padding: 20px 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 32px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
            font-size: 18px;
        }

        .hero {

            height: 90vh;

            background:
            linear-gradient(rgba(0,0,0,0.5),
            rgba(0,0,0,0.5)),

            url('https://images.unsplash.com/photo-1511499767150-a48a237f0083?q=80&w=1400&auto=format&fit=crop');

            background-size: cover;

            background-position: center;

            display: flex;

            justify-content: center;

            align-items: center;

            flex-direction: column;

            text-align: center;

            color: white;
        }

        .hero h2 {
            font-size: 70px;
            margin-bottom: 20px;
        }

        .hero p {
            font-size: 24px;
            margin-bottom: 30px;
        }

        .hero button {

            padding: 15px 35px;

            border: none;

            background: orange;

            color: white;

            font-size: 18px;

            border-radius: 8px;

            cursor: pointer;

            transition: 0.3s;
        }

        .hero button:hover {
            background: darkorange;
        }

        .products {

            padding: 70px 40px;

            text-align: center;
        }

        .products h2 {

            font-size: 42px;

            margin-bottom: 50px;
        }

        .product-grid {

            display: grid;

            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));

            gap: 30px;
        }

        .card {

            background: white;

            border-radius: 12px;

            overflow: hidden;

            box-shadow: 0 5px 15px rgba(0,0,0,0.1);

            transition: 0.3s;
        }

        .card:hover {

            transform: translateY(-10px);
        }

        .card img {

            width: 100%;

            height: 260px;

            object-fit: cover;
        }

        .card h3 {

            margin-top: 20px;

            margin-bottom: 10px;

            font-size: 24px;
        }

        .card p {

            color: #777;

            margin-bottom: 15px;

            font-size: 18px;
        }

        .card button {

            margin-bottom: 20px;

            padding: 10px 25px;

            background: black;

            color: white;

            border: none;

            border-radius: 6px;

            cursor: pointer;
        }

        footer {

            background: black;

            color: white;

            text-align: center;

            padding: 20px;

            margin-top: 40px;
        }

    </style>

</head>

<body>

<header>

    <h1>Sunglasses Store</h1>

    <nav>

        <a href="#">Home</a>

        <a href="#">Products</a>

        <a href="#">Contact</a>

    </nav>

</header>

<section class="hero">

    <h2>Premium Sunglasses</h2>

    <p>Luxury Style For Modern Fashion</p>

    <button>Shop Now</button>

</section>

<section class="products">

    <h2>Trending Collection</h2>

    <div class="product-grid">

        <div class="card">

            <img src="https://images.unsplash.com/photo-1511920170033-f8396924c348?q=80&w=800&auto=format&fit=crop">

            <h3>Classic Black</h3>

            <p>₹1999</p>

            <button>Buy Now</button>

        </div>

        <div class="card">

            <img src="https://images.unsplash.com/photo-1577803645773-f96470509666?q=80&w=800&auto=format&fit=crop">

            <h3>Modern Gold</h3>

            <p>₹2499</p>

            <button>Buy Now</button>

        </div>

        <div class="card">

            <img src="https://images.unsplash.com/photo-1517841905240-472988babdf9?q=80&w=800&auto=format&fit=crop">

            <h3>Luxury Edition</h3>

            <p>₹3499</p>

            <button>Buy Now</button>

        </div>

    </div>

</section>

<footer>

    <p>© 2026 Sunglasses Store | DevOps Project</p>

</footer>

</body>

</html>
