<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sunglasses Store</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f4f4;
        }

        header {
            background: black;
            color: white;
            padding: 20px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 32px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
            font-size: 18px;
        }

        .login-container {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background:
            linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)),
            url('https://images.unsplash.com/photo-1511499767150-a48a237f0083?q=80&w=1400&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
        }

        .login-box {
            background: white;
            padding: 40px;
            border-radius: 12px;
            width: 350px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
            text-align: center;
        }

        .login-box h2 {
            margin-bottom: 25px;
        }

        .login-box input {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        .login-box button {
            width: 100%;
            padding: 12px;
            border: none;
            background: orange;
            color: white;
            font-size: 18px;
            border-radius: 6px;
            cursor: pointer;
        }

        .main-content {
            display: none;
        }

        .hero {
            height: 80vh;
            background:
            linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)),
            url('https://images.unsplash.com/photo-1511920170033-f8396924c348?q=80&w=1400&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            color: white;
            text-align: center;
        }

        .hero h2 {
            font-size: 60px;
            margin-bottom: 20px;
        }

        .hero p {
            font-size: 22px;
        }

        .products {
            padding: 70px 40px;
            text-align: center;
        }

        .products h2 {
            margin-bottom: 40px;
            font-size: 40px;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 30px;
        }

        .card {
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            transition: 0.3s;
        }

        .card:hover {
            transform: translateY(-10px);
        }

        .card img {
            width: 100%;
            height: 260px;
            object-fit: cover;
        }

        .card h3 {
            margin-top: 15px;
        }

        .card p {
            margin: 15px 0;
            color: #666;
        }

        .card button {
            margin-bottom: 20px;
            padding: 10px 25px;
            background: black;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        footer {
            background: black;
            color: white;
            text-align: center;
            padding: 20px;
        }

    </style>

</head>
<body>

<div class="login-container" id="loginPage">

    <div class="login-box">

        <h2>Login</h2>

        <input type="text" id="username" placeholder="Enter Username">

        <input type="password" id="password" placeholder="Enter Password">

        <button onclick="login()">Login</button>

    </div>

</div>

<div class="main-content" id="mainPage">

<header>

    <h1>Sunglasses Store</h1>

    <nav>

        <a href="#home">Home</a>

        <a href="#products">Products</a>

        <a href="#contact">Contact</a>

    </nav>

</header>

<section class="hero" id="home">

    <h2>Premium Sunglasses</h2>

    <p>Luxury Fashion For Modern Lifestyle</p>

</section>

<section class="products" id="products">

    <h2>Trending Products</h2>

    <div class="product-grid">

        <div class="card">

            <img src="https://images.unsplash.com/photo-1511499767150-a48a237f0083?q=80&w=800&auto=format&fit=crop">

            <h3>Classic Black</h3>

            <p>₹1999</p>

            <button>Buy Now</button>

        </div>

        <div class="card">

            <img src="https://images.unsplash.com/photo-1577803645773-f96470509666?q=80&w=800&auto=format&fit=crop">

            <h3>Modern Gold</h3>

            <p>₹2499</p>

            <button>Buy Now</button>

        </div>

        <div class="card">

            <img src="https://images.unsplash.com/photo-1517841905240-472988babdf9?q=80&w=800&auto=format&fit=crop">

            <h3>Luxury Edition</h3>

            <p>₹3499</p>

            <button>Buy Now</button>

        </div>

    </div>

</section>

<footer id="contact">

    <p>© 2026 Sunglasses Store | DevOps Demo Project</p>

</footer>

</div>

<script>

    function login() {

        let username = document.getElementById("username").value;

        let password = document.getElementById("password").value;

        if(username === "admin" && password === "admin123") {

            document.getElementById("loginPage").style.display = "none";

            document.getElementById("mainPage").style.display = "block";

        } else {

            alert("Invalid Username or Password");
        }
    }

</script>

</body>
</html>
